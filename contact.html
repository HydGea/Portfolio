<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js"></script>

</head>
<body>
    <div class="page-wrapper">
        <nav>
            <img src="assets/Aaron Villaluz Logo.svg" alt="Logo" class="logo">
            <div class="nav-menu">
                <a href="index.html"><p class="nav-menu-item">Home</p></a>
                <p class="nav-menu-item">About</p>
                <a href="contact.html"><p class="nav-menu-item">Contact</p></a>
            </div>
        </nav>
        <div class="contact-main">
            <div class="card contact">
                <img src="assets/Aaron Villaluz Logo.svg" alt="Logo" class="logo-contact">
                <hr>
                <h1 class="page-title">Get in Touch</h1>
                <form>
                    <div class="form-container">
                        <div class="field">
                            <p class="label">Name</p>
                            <input class="text-field"
                                type="text"
                                id="name"
                                name="name"
                                placeholder="Name"
                                required
                            />
                        </div>
                        <div class="field textarea">
                            <p class="label">Message</p>
                            <textarea
                                id="message"
                                name="message"
                                placeholder="Write your message..."
                                required></textarea>
                        </div>
                    </div> 
                    <button>Submit</button>
                </form>
                <hr>
                <div class="social-container">
                    <a><img src="assets/socials/Resume.svg" class="social"></a>
                    <a href="https://www.linkedin.com/in/aaronvillaluz/" target="_blank"><img src="assets/socials/Linkedin.svg" class="social"></a>
                    <a href="https://github.com/HydGea" target="_blank"><img src="assets/socials/Github.svg" class="social"></a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
